[project]
name = "sudoku-app"
version = "0.1.0"
description = "數獨桌面遊戲（customtkinter 現代扁平 UI）"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
sudoku = "sudoku.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sudoku"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: 壓力/生成迴歸測試，較耗時；CI 日常門檻以 -m 'not slow' 跑快速集",
]
