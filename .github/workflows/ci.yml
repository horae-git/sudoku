name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      # 日常門檻：跑快速測試（排除 slow 壓力測試）；slow標記見 pyproject markers
      - run: uv run pytest -m "not slow" -q
